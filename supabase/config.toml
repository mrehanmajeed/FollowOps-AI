project_id = "followops-ai"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.pooler]
enabled = false
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true

[auth]
enabled = true

[storage]
enabled = true
file_size_limit = "10MiB"
